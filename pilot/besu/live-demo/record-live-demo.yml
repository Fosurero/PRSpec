# Fork-only live demo recorder for the PRSpec Besu pilot. Copy to
# .github/workflows/ on a branch named prspec-demo-record of a Besu FORK, with
# the other files of this folder in .github/prspec-demo/. Never install it on
# besu-eth/besu.
#
# It records a real screen on this GitHub-hosted runner (Xvfb + xterm, captured
# by ffmpeg x11grab in real time): PRSpec analyses Besu code at two pinned
# commits with live model requests, then Chrome shows the generated HTML reports
# and the public GitHub pages of the pilot PR and its run. Video, transcript,
# reports and the pilot run's artifacts and logs are secret-scanned and pushed
# to the prspec-evidence branch of the same fork.
name: PRSpec live demo recording (fork only)

on:
  push:
    branches: [prspec-demo-record]

permissions:
  contents: write        # push the prspec-evidence branch of this fork
  actions: read          # read the pilot run's artifacts and logs
  pull-requests: read

concurrency:
  group: prspec-demo-record
  cancel-in-progress: false

env:
  PRSPEC_REPO: https://github.com/Hardisky/PRSpec
  PRSPEC_COMMIT: __PRSPEC_COMMIT__
  BEFORE_SHA: 19c989a6d96bb412f3815d14687da8cc334f1286  # Besu just before the PR #5786 fix
  AFTER_SHA: 7605351c1ae86c955b28df90f66ede9c9c5f1386   # Besu with the PR #5786 fix
  EIPS_COMMIT: eb2e7a97aa70b1d7f39968c6be9ed3e731512f9d
  PRSPEC_MODELS: "gemini:gemini-3.8-flash gemini:gemini-3.6-flash meta:muse-wonder-1.0"

jobs:
  record:
    if: github.repository != 'besu-eth/besu'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the demo scripts (this branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ctl
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/prspec-demo

      - name: Check out Besu before the fix (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BEFORE_SHA }}
          path: work/besu-before
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ethereum/blockcreation/src/main/java/org/hyperledger/besu/ethereum/blockcreation/AbstractBlockCreator.java
            ethereum/core/src/main/java/org/hyperledger/besu/ethereum/mainnet/feemarket/ExcessBlobGasCalculator.java
            evm/src/main/java/org/hyperledger/besu/evm/gascalculator/CancunGasCalculator.java

      - name: Check out Besu with the fix (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AFTER_SHA }}
          path: work/besu-after
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ethereum/blockcreation/src/main/java/org/hyperledger/besu/ethereum/blockcreation/AbstractBlockCreator.java
            ethereum/core/src/main/java/org/hyperledger/besu/ethereum/mainnet/feemarket/ExcessBlobGasCalculator.java
            evm/src/main/java/org/hyperledger/besu/evm/gascalculator/CancunGasCalculator.java

      - name: Check out the pinned EIP text
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ethereum/EIPs
          ref: ${{ env.EIPS_COMMIT }}
          path: work/eips
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: EIPS/eip-4844.md

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned PRSpec and the screen-recording tools
        run: |
          pip install -q "git+${PRSPEC_REPO}@${PRSPEC_COMMIT}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xterm xdotool x11-utils fonts-dejavu-core ffmpeg > /dev/null
          cp ctl/.github/prspec-demo/demo-config.yaml work/
          prspec --version; ffmpeg -version | head -1; google-chrome --version

      - name: Find the pilot PR and its latest completed run (read-only)
        id: pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api "repos/${GITHUB_REPOSITORY}/$1" --jq "$2" 2> /dev/null || true; }
          runs='actions/workflows/prspec-pilot.yml/runs?status=completed&per_page=1'
          {
            echo "pr_url=$(api 'pulls?state=all&base=prspec-demo-base&per_page=1' '.[0].html_url // empty')"
            echo "run_id=$(api "$runs" '.workflow_runs[0].id // empty')"
            echo "run_url=$(api "$runs" '.workflow_runs[0].html_url // empty')"
            echo "trigger_id=$(api 'actions/workflows/prspec-pilot-trigger.yml/runs?status=completed&per_page=1' '.workflow_runs[0].id // empty')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Record the live session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.PRSPEC_META_API_KEY }}
          WORK: ${{ github.workspace }}/work
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.pilot.outputs.pr_url }}
          PILOT_RUN_URL: ${{ steps.pilot.outputs.run_url }}
        run: bash ctl/.github/prspec-demo/record.sh

      - name: Collect the pilot PR run's artifacts and logs
        if: always() && steps.pilot.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RUN_ID: ${{ steps.pilot.outputs.run_id }}
          TRIGGER_RUN_ID: ${{ steps.pilot.outputs.trigger_id }}
        run: |
          d=work/evidence/pilot-pr-run; mkdir -p "$d"
          gh run download "$PILOT_RUN_ID" -R "$GITHUB_REPOSITORY" -D "$d/artifacts" || true
          gh run view "$PILOT_RUN_ID" -R "$GITHUB_REPOSITORY" --log > "$d/pilot.log" || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PILOT_RUN_ID}/jobs" > "$d/pilot-jobs.json" || true
          if [ -n "$TRIGGER_RUN_ID" ]; then
            gh run view "$TRIGGER_RUN_ID" -R "$GITHUB_REPOSITORY" --log > "$d/trigger.log" || true
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}" > "$d/trigger-run.json" || true
          fi

      - name: Gather reports, scan for secrets and write the manifest
        id: scan
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.PRSPEC_META_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PILOT_RUN_ID: ${{ steps.pilot.outputs.run_id }}
        run: |
          for side in before after; do
            mkdir -p "work/evidence/$side"
            cp -r "work/out/$side/." "work/evidence/$side/" 2> /dev/null || true
          done
          python3 ctl/.github/prspec-demo/manifest.py work/evidence && echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: Publish the evidence to the prspec-evidence branch of this fork
        if: always() && steps.scan.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cd publish && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          url="https://github.com/${GITHUB_REPOSITORY}"
          if git -c http.extraheader="$auth" fetch -q --depth 1 "$url" prspec-evidence 2> /dev/null; then
            git checkout -q -b prspec-evidence FETCH_HEAD
          else
            git checkout -q --orphan prspec-evidence
          fi
          dest="runs/${GITHUB_RUN_ID}"; mkdir -p "$dest"
          cp -r ../work/evidence/. "$dest/"
          git add -A
          git commit -qm "PRSpec live demo evidence (run ${GITHUB_RUN_ID})"
          git -c http.extraheader="$auth" push -q "$url" HEAD:refs/heads/prspec-evidence
          echo "Evidence: $url/tree/prspec-evidence/$dest" >> "$GITHUB_STEP_SUMMARY"
