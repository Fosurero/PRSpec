[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prspec"
version = "2.0.0"
description = "Ethereum specification compliance checker — compares EIP specs against client source code using LLM analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Safi El-Hassanine"},
]
keywords = ["ethereum", "eip", "specification", "compliance", "llm", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "google-genai>=1.51.0",
    "openai>=1.40.0",
    "requests",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-go",
    "pyyaml",
    "python-dotenv",
    "click",
    "rich",
    "gitpython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Fosurero/PRSpec"
Repository = "https://github.com/Fosurero/PRSpec"
Issues = "https://github.com/Fosurero/PRSpec/issues"

[project.scripts]
prspec = "src.cli:cli"

# The package is literally named "src" (imports use "from src..."), so
# setuptools must not treat ./src as a src-layout root. Without this the
# installed "prspec" entry point fails with "No module named 'src'".
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

# Ship the default config so an installed "prspec" works outside a checkout.
# src/default_config.yaml must stay identical to ./config.yaml (tested).
[tool.setuptools.package-data]
src = ["default_config.yaml", "rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
